<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>最終デザイン案比較 | 東洋大学二部体育会空手道部</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #141416;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .control-bar {
      background: #0d0d0f;
      border-bottom: 1px solid #2c2c30;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .bar-title {
      font-size: 0.88rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bar-badge {
      background: #ffffff;
      color: #111111;
      font-size: 0.7rem;
      padding: 2px 8px;
    }
    .plan-tabs { display: flex; gap: 8px; }
    .plan-btn {
      background: #222226;
      color: #cccccc;
      border: 1px solid #3a3a40;
      padding: 8px 18px;
      font-size: 0.84rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .plan-btn.is-active {
      background: #ffffff;
      color: #111111;
      border-color: #ffffff;
    }
    .view-tools { display: flex; align-items: center; gap: 8px; }
    .device-btn {
      background: #222226;
      color: #999;
      border: 1px solid #3a3a40;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .device-btn.is-active {
      background: #3a3a40;
      color: #ffffff;
    }
    .open-direct-link {
      background: #0f2350;
      color: #ffffff;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .desc-bar {
      background: #1c1c20;
      border-bottom: 1px solid #2c2c30;
      padding: 6px 20px;
      font-size: 0.8rem;
      color: #cccccc;
    }
    .preview-stage {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #26262b;
      overflow: hidden;
    }
    .preview-stage.is-mobile-mode { padding: 16px; }
    iframe#previewFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      transition: width 0.3s ease, border-radius 0.3s ease;
    }
    .preview-stage.is-mobile-mode iframe#previewFrame {
      width: 390px;
      max-height: 820px;
      border-radius: 24px;
      border: 6px solid #0d0d0f;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    @media (max-width: 768px) {
      .view-tools { display: none; }
    }
  </style>
</head>
<body>
  <div class="control-bar">
    <div class="bar-title">
      <span class="bar-badge">最終候補2案比較</span>
      <span>東洋大学二部体育会空手道部</span>
    </div>
    <div class="plan-tabs">
      <button class="plan-btn is-active" data-file="index.html" data-desc="【案1】和紙モノトーン・縦書き＆浮遊写真。武道の伝統と凛とした空気感を重視したデザイン">
        案1：和紙モノトーン・浮遊写真
      </button>
      <button class="plan-btn" data-file="plan3.html" data-desc="【案3】左右2分割カラースライド。鉄紺などテーマカラーが切り替わるモダンで快活なデザイン">
        案3：2分割カラースライド
      </button>
    </div>
    <div class="view-tools">
      <button class="device-btn" id="btnPc">PC表示</button>
      <button class="device-btn is-active" id="btnMobile">スマホ表示（推奨）</button>
      <a href="index.html" target="_blank" rel="noopener" class="open-direct-link" id="directLink">全画面で開く ↗</a>
    </div>
  </div>
  <div class="desc-bar" id="planDesc">【案1】和紙モノトーン・縦書き＆浮遊写真。武道の伝統と凛とした空気感を重視したデザイン</div>
  <div class="preview-stage is-mobile-mode" id="previewStage">
    <iframe id="previewFrame" src="index.html" title="デザイン案プレビュー"></iframe>
  </div>
  <script>
    const planBtns = document.querySelectorAll('.plan-btn');
    const previewFrame = document.getElementById('previewFrame');
    const planDesc = document.getElementById('planDesc');
    const directLink = document.getElementById('directLink');
    const previewStage = document.getElementById('previewStage');
    const btnPc = document.getElementById('btnPc');
    const btnMobile = document.getElementById('btnMobile');

    planBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        planBtns.forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        const file = btn.getAttribute('data-file');
        previewFrame.src = file;
        planDesc.textContent = btn.getAttribute('data-desc');
        directLink.href = file;
      });
    });

    btnPc.addEventListener('click', () => {
      btnPc.classList.add('is-active');
      btnMobile.classList.remove('is-active');
      previewStage.classList.remove('is-mobile-mode');
    });

    btnMobile.addEventListener('click', () => {
      btnMobile.classList.add('is-active');
      btnPc.classList.remove('is-active');
      previewStage.classList.add('is-mobile-mode');
    });
  </script>
</body>
</html>
