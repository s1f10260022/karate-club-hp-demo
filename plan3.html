<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>東洋大学二部体育会空手道部 | TOYO UNIV. KARATE CLUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@600;700&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-color: #0f2350; /* 初期カラー：鉄紺 */
      --ink-dark: #18181b;
      --ink-muted: #52525b;
      --bg-light: #ffffff;
      --bg-subtle: #f8f8fa;
      --border-subtle: #e4e4e7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      color: var(--ink-dark);
      background-color: var(--bg-light);
      line-height: 1.8;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .display-font {
      font-family: 'Syne', 'Oswald', sans-serif;
      letter-spacing: -0.02em;
    }

    .en-font {
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* =========================================
       ローディング演出（高速・洗練版）
    ========================================= */
    .loader-screen {
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8vw;
      transition: transform 0.65s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .loader-screen.is-done {
      transform: translateY(-100%);
      pointer-events: none;
    }

    .loader-brand {
      font-size: clamp(1.8rem, 4.5vw, 3.8rem);
      font-weight: 800;
      color: var(--theme-color);
      line-height: 1;
    }

    .loader-count {
      font-size: clamp(1.5rem, 3vw, 2.4rem);
      font-weight: 800;
      color: var(--theme-color);
    }

    /* =========================================
       PC左サイドレール ＆ スマホ上部ヘッダー
    ========================================= */
    .side-rail {
      position: fixed;
      top: 0;
      left: 0;
      width: 48px;
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid var(--border-subtle);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0;
    }

    .side-rail-top {
      writing-mode: vertical-rl;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--ink-muted);
    }

    .side-rail-menu {
      writing-mode: vertical-rl;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    /* スマホ専用ヘッダー */
    .mobile-header {
      display: none;
    }

    @media (max-width: 860px) {
      .side-rail {
        display: none;
      }
      .mobile-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 56px;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border-subtle);
        z-index: 1100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .mobile-logo {
        font-weight: 900;
        font-size: 0.88rem;
        color: var(--theme-color);
        transition: color 0.6s ease;
      }
      .mobile-menu-btn {
        width: 44px;
        height: 44px;
        background: none;
        border: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
      }
      .mobile-menu-btn span {
        display: block;
        width: 22px;
        height: 2px;
        background: var(--ink-dark);
        transition: transform 0.3s ease, opacity 0.3s ease;
      }
      .mobile-menu-btn[aria-expanded="true"] span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      .mobile-menu-btn[aria-expanded="true"] span:nth-child(2) {
        opacity: 0;
      }
      .mobile-menu-btn[aria-expanded="true"] span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }
    }

    /* スマホ全画面ナビゲーション */
    .mobile-nav-overlay {
      position: fixed;
      inset: 0;
      background: var(--theme-color);
      color: #ffffff;
      z-index: 1050;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 28px 36px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease, background-color 0.6s ease;
    }

    .mobile-nav-overlay.is-open {
      opacity: 1;
      visibility: visible;
    }

    .mobile-nav-overlay ul {
      list-style: none;
      margin-bottom: 32px;
    }

    .mobile-nav-overlay li {
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .mobile-nav-overlay a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* =========================================
       ファーストビュー：2分割カラースライド
    ========================================= */
    .split-hero {
      position: relative;
      margin-left: 48px;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 42% 58%;
      overflow: hidden;
    }

    .hero-left-panel {
      background-color: var(--theme-color);
      color: #ffffff;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background-color 0.7s ease;
      position: relative;
      z-index: 10;
    }

    .mega-logo {
      font-size: clamp(2.5rem, 4.8vw, 4.4rem);
      font-weight: 800;
      line-height: 0.95;
      color: #ffffff;
    }

    .brand-tagline {
      margin-top: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.9;
    }

    .hero-menu-list {
      list-style: none;
      margin: 28px 0;
    }

    .hero-menu-list li {
      margin-bottom: 10px;
    }

    .hero-menu-list a {
      font-size: clamp(1.35rem, 2.2vw, 1.85rem);
      font-weight: 700;
      display: inline-flex;
      align-items: baseline;
      gap: 12px;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .hero-menu-list a:hover {
      transform: translateX(8px);
      opacity: 0.85;
    }

    .hero-menu-list a span.jp-sub {
      font-size: 0.78rem;
      font-weight: 500;
      opacity: 0.8;
    }

    .hero-topics {
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      padding-top: 16px;
    }

    .topics-label {
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .topics-link {
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* 右側スライドショーエリア（スワイプ対応） */
    .hero-right-visual {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #111;
      overflow: hidden;
      touch-action: pan-y;
    }

    .slide-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: translateY(100%);
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1;
    }

    .slide-frame.is-active {
      transform: translateY(0);
      z-index: 3;
    }

    .slide-frame.is-prev {
      transform: translateY(-18%);
      z-index: 2;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slide-overlay-caption {
      position: absolute;
      bottom: 36px;
      left: 36px;
      right: 84px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink-dark);
      padding: 20px 24px;
      backdrop-filter: blur(8px);
    }

    .slide-overlay-caption h2 {
      font-size: clamp(1.15rem, 2.2vw, 1.65rem);
      font-weight: 900;
      margin-bottom: 4px;
    }

    .slide-overlay-caption p {
      font-size: 0.88rem;
      color: var(--ink-muted);
    }

    /* タップ領域を44px確保したスライド切り替えドット */
    .slide-dots {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slide-dot {
      width: 44px;
      height: 44px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-dot::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      background: rgba(0, 0, 0, 0.3);
      transition: background 0.2s, transform 0.2s;
    }

    .slide-dot.is-active::after {
      background: #ffffff;
      transform: scale(1.3);
    }

    /* スマホファースト調整：ファーストビューで必ず写真とキャッチが画面内に収まる */
    @media (max-width: 860px) {
      .split-hero {
        margin-left: 0;
        padding-top: 56px;
        display: flex;
        flex-direction: column-reverse;
        min-height: 100svh;
      }
      .hero-right-visual {
        height: 56svh;
      }
      .slide-overlay-caption {
        bottom: 16px;
        left: 16px;
        right: 56px;
        padding: 14px 16px;
      }
      .hero-left-panel {
        padding: 24px 20px 32px;
        flex: 1;
      }
      .mega-logo {
        font-size: 2rem;
      }
      .hero-menu-list {
        display: none; /* スマホは上部ハンバーガーメニューに集約 */
      }
      .hero-topics {
        margin-top: 16px;
      }
    }

    /* =========================================
       メインコンテンツ共通
    ========================================= */
    main {
      margin-left: 48px;
    }

    @media (max-width: 860px) {
      main {
        margin-left: 0;
      }
    }

    .section-wrap {
      padding: 96px 6vw;
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-wrap.is-subtle {
      background: var(--bg-subtle);
    }

    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 44px;
    }

    .section-big-title {
      font-size: clamp(2rem, 4.2vw, 3.2rem);
      font-weight: 800;
      line-height: 1;
      color: var(--ink-dark);
    }

    .section-jp-note {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink-muted);
      margin-top: 8px;
    }

    @media (max-width: 768px) {
      .section-wrap {
        padding: 68px 20px;
      }
    }

    /* =========================================
       GALLERY（横スクロールギャラリー）
    ========================================= */
    .filter-tabs {
      display: flex;
      gap: 8px;
    }

    .filter-tab {
      min-height: 44px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 14px;
      color: var(--ink-muted);
      border-bottom: 2px solid transparent;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .filter-tab.is-active {
      color: var(--ink-dark);
      border-bottom-color: var(--theme-color);
    }

    .horizontal-gallery {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      padding-bottom: 20px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .horizontal-gallery::-webkit-scrollbar {
      height: 5px;
    }

    .horizontal-gallery::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .gallery-card {
      flex: 0 0 290px;
      scroll-snap-align: start;
      background: #ffffff;
      transition: transform 0.3s ease;
    }

    @media (max-width: 480px) {
      .gallery-card {
        flex: 0 0 80vw;
      }
    }

    .gallery-thumb {
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #f4f4f5;
      margin-bottom: 14px;
    }

    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .gallery-card:hover .gallery-thumb img {
      transform: scale(1.04);
    }

    .gallery-cat {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--theme-color);
      display: block;
      margin-bottom: 4px;
      transition: color 0.6s ease;
    }

    .gallery-title {
      font-size: 0.96rem;
      font-weight: 700;
    }

    /* =========================================
       INSTRUCTORS（指導員紹介：枠線なしの洗練レイアウト）
    ========================================= */
    .instructors-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px;
    }

    .instructor-card {
      display:
